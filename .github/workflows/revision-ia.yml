# Revisión automática de cada PR por el agente revisor (complementa, no reemplaza, la aprobación humana).
name: Revisión IA

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  revisar:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      # Sin el secreto ANTHROPIC_API_KEY la revisión se omite con un aviso en vez de marcar el PR en rojo.
      TIENE_CLAVE: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Avisar que falta la clave
        if: env.TIENE_CLAVE != 'true'
        run: echo "::warning::Revisión IA omitida; agregue el secreto ANTHROPIC_API_KEY para activarla (docs/07-uso-de-ia.md)."
      - uses: actions/checkout@v5
        if: env.TIENE_CLAVE == 'true'
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        if: env.TIENE_CLAVE == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Repositorio ${{ github.repository }}, PR #${{ github.event.pull_request.number }}.
            Actúe como el subagente `revisor` definido en .claude/agents/revisor.md: revise el diff contra CLAUDE.md
            y publique los hallazgos como comentarios en las líneas del PR, con un resumen y el veredicto.
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
