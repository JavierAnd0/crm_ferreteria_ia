<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f4e79">
  <title>Inventario Ferretería</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="barra">
    <button id="btn-menu" class="icono" aria-label="Menú">☰</button>
    <strong>Inventario Ferretería</strong>
    <span id="estado-red" class="pastilla"></span>
    <span id="pendientes" class="pastilla aviso" hidden></span>
    <span class="espacio"></span>
    <span id="usuario"></span>
    <button id="btn-salir" class="secundario" hidden>Salir</button>
  </header>
  <div class="cuerpo">
    <nav id="menu" hidden></nav>
    <main id="vista" tabindex="-1"></main>
  </div>
  <div id="aviso" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
